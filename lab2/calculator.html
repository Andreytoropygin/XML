<!DOCTYPE html>
<html>

<head>
  <title>Калькулятор</title>
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript" src="script.js"></script>
</head>

<body id="body">
  <div class="main"> <!-- div - это базовый html-контейнер, который может содержать в себе другие html-элементы. -->
    <p>
      Цель данной лабораторной работы - <mark>знакомство</mark>
      с инструментами построения пользовательских интерфейсов 
      web-сайтов: <mark>HTML</mark>, <mark>CSS</mark>.
    </p>
    
    <div class="calculator">
      <!-- блок с экраном калькулятора, где будет выводиться результат вычислений. -->
      <div id="result" class="result res_dark">
        0
      </div>

      <!-- блок с кнопками калькулятора. -->
      <div class="keyboard">
        <!--горизонтальный ряд из четырех кнопок-->
        <div>  
          <button id="btn_op_clear" class="my-btn secondary">C</button>    <!-- про тэг кнопки: https://www.w3schools.com/tags/tag_button.asp -->
          <button id="btn_op_sign" class="my-btn secondary">+/-</button>
          <button id="btn_op_percent" class="my-btn secondary">%</button>
          <button id="btn_op_backspace" class="my-btn secondary">&lt-</button>
          <button id="btn_op_res_color" class="my-btn secondary">#</button>
        </div>

        <div>
          <button id="btn_digit_7" class="my-btn">7</button>
          <button id="btn_digit_8" class="my-btn">8</button>
          <button id="btn_digit_9" class="my-btn">9</button>
          <button id="btn_op_mult" class="my-btn primary">x</button>
          <button id="btn_op_div" class="my-btn primary">/</button>
        </div>

        <div>
          <button id="btn_digit_4" class="my-btn">4</button>
          <button id="btn_digit_5" class="my-btn">5</button>
          <button id="btn_digit_6" class="my-btn">6</button>
          <button id="btn_op_minus" class="my-btn primary">-</button>
          <button id="btn_op_sqrt" class="my-btn primary">√</button>
        </div>

        <div>
          <button id="btn_digit_1" class="my-btn">1</button>
          <button id="btn_digit_2" class="my-btn">2</button>
          <button id="btn_digit_3" class="my-btn">3</button>
          <button id="btn_op_plus" class="my-btn primary">+</button>
          <button id="btn_op_square" class="my-btn primary">x²</button>
        </div>

        <div>
          <button id="btn_digit_0" class="my-btn">0</button>
          <button id="btn_digit_dot" class="my-btn">.</button>
          <button id="btn_op_equal" class="my-btn primary execute">=</button>
          <button id="btn_op_factorial" class="my-btn primary">x!</button>
        </div>

        <div>
            <button id="btn_op_semitone", class="my-btn primary semitone">Hz => semitone</button>
            <button id="btn_digit_000" class="my-btn primary">000</button>
        </div>
      </div>
    </div>

    <select class="selector">
      <option>ИУ5</option>
      <option>ЛУЧШАЯ</option>
      <option>КАФЕДРА</option>
    </select>

    <details class="author_info">
      <summary>
        <strong> Автор</strong>
      </summary>
      <p>ФИО: Торопыгин Андрей Алексеевич</p>
      <p>Группа: ИУ5-45Б</p>
    </details>
    
    <a class="git_ref" href="https://github.com/Andreytoropygin/XML_tech" target="_blank">GitHub</a>

    <button id="change_theme" class="change_theme">Поменять фон</button>

    <p>ЛР выполнена Торопыгиным Андреем Алексеевичем</p>
  
  </div>
</body>
</html>
